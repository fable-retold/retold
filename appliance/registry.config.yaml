# Verdaccio configuration for the Retold appliance.
#
# Serve-first posture: it hosts whatever has been warehoused under storage/ (rsynced from a dev
# machine, or published in with `rnp`), and proxies npmjs for anything not held locally. Publishing
# is open on the trusted network so `rnp publish` / `npm publish --registry ...` can push the current
# versions in -- which is how the publish debt gets closed for every node that points here.
#
# storage is absolute on purpose: it points at the mounted /data volume, not the image.

storage: /data/registry/storage

auth:
  htpasswd:
    file: /data/registry/htpasswd
    max_users: 1000

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: true

packages:
  '**':
    access: $all
    publish: $all
    proxy: npmjs

# Bound to all interfaces so the port is reachable from other machines on the tailnet.
listen: 0.0.0.0:4873

log: { type: stdout, format: pretty, level: http }
